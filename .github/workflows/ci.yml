name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      # Verifies gradle-wrapper.jar's checksum against Gradle's own published list before
      # anything in this job executes it -- catches a tampered wrapper (supply-chain risk),
      # not just a broken one.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Also sets up Gradle's dependency/build cache via the GitHub Actions cache backend
      # (free for both public and private repos), so repeat runs are much faster.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Belt-and-suspenders: the executable bit is now set in the git index (verified via
      # `git ls-files -s gradlew`), but this costs nothing and removes any fragility if that
      # ever regresses (e.g. Windows tooling with core.fileMode=false re-committing gradlew).
      - run: chmod +x gradlew

      # google-services.json is gitignored (item 17) -- the Google Services Gradle plugin
      # requires one per flavor to exist before ANY Gradle task can run (even unit tests),
      # so this has to happen before every step below. Written from repo secrets, never
      # committed -- separate secrets per flavor since the two files aren't guaranteed to
      # stay identical (e.g. if dev and prod ever move to separate Firebase projects).
      # GitHub masks secret values in logs automatically.
      #
      # Falls back to a committed placeholder when the secrets are absent. That is not a
      # convenience -- it is the fix for a bug that silently disabled dependency maintenance
      # on this repo for months. GitHub deliberately withholds repo secrets from
      # Dependabot-triggered pull_request runs (they live in a separate Dependabot secrets
      # store), so both variables arrived EMPTY, this step wrote two empty files, and the
      # build died at processDevDebugGoogleServices with "Malformed root json". Every
      # Dependabot PR therefore failed CI regardless of what it bumped, which made the signal
      # permanently red and told nobody anything -- and is why none were ever merged.
      #
      # The placeholder carries no credentials; it exists only so the Google Services plugin
      # can resolve a client for each flavor's package name. Real pushes to master have the
      # secrets and use the real config, so this changes nothing about a genuine build.
      - name: Write Firebase config (google-services.json)
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_DEV" ] && [ -n "$GOOGLE_SERVICES_JSON_PROD" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_DEV" > app/src/dev/google-services.json
            printf '%s' "$GOOGLE_SERVICES_JSON_PROD" > app/src/prod/google-services.json
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
            echo "Using the real Firebase configuration from repository secrets."
          else
            cp .github/google-services-placeholder.json app/src/dev/google-services.json
            cp .github/google-services-placeholder.json app/src/prod/google-services.json
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase secrets are unavailable in this context (expected for" \
                 "Dependabot and fork pull requests). Building against a placeholder" \
                 "google-services.json: compilation, tests, lint and R8 are all still" \
                 "verified, but no Firebase-dependent behaviour is exercised and the" \
                 "release bundle will not be uploaded."
          fi

      # Release signing, written from repo secrets when they exist. Deliberately conditional:
      # with no secrets configured this step writes nothing, hasReleaseSigningConfig stays
      # false, and the release build is unsigned -- exactly the previous behavior, so a fork
      # or a contributor's PR still builds. Once ANDROID_KEYSTORE_BASE64 and its three
      # passwords are set on the repo, the same workflow starts producing a signed,
      # Play-uploadable .aab with no further edits.
      #
      # The keystore itself is never committed; it arrives base64-encoded through a secret and
      # is written outside the source tree's tracked paths (keystore.properties is gitignored,
      # and upload-keystore.jks is covered by the same ignore rule). GitHub masks secret values
      # in logs, and nothing here echoes them.
      - name: Write release signing config (only when secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest

      - name: Lint
        run: ./gradlew lintDevDebug

      # A "Dependency freshness report" step (com.github.ben-manes.versions) is deliberately
      # not here. It was originally reverted because the plugin broke kspDevDebugKotlin on the
      # old Kotlin 2.0.21 / KSP / AGP 8.7.3 combination; that toolchain has since moved to
      # Kotlin 2.3.21 / KSP 2.3.11 / AGP 8.13.2 and the plugin was re-tested on it and works.
      # It stays out because Dependabot now actually reports on this repo -- its PRs used to
      # fail CI unconditionally at the Firebase-config step above, which is what made a
      # compensating control look necessary in the first place. See root build.gradle.kts.
      # OWASP dependency-check-gradle (NVD sync,
      # needs an API key this project doesn't have) and a GITHUB_TOKEN-driven Dependabot-
      # alerts-API call (the default Actions token cannot authenticate to that endpoint at all,
      # regardless of the permissions: block -- only a GitHub App or fine-grained PAT with the
      # separate "Dependabot alerts" repository permission can) were separately evaluated and
      # rejected as heavier alternatives.

      - name: Build debug APKs (both flavors)
        run: ./gradlew assembleDevDebug assembleProdDebug

      # Unsigned, not uploaded anywhere -- this only re-validates that R8/shrinking (item 13)
      # still produces a working build on every change, the same check performed manually
      # when minification was first turned on.
      - name: Build release APK (exercises R8/shrinking)
        run: ./gradlew assembleProdRelease

      # The actual publishable artifact. Google Play accepts an Android App Bundle, not an
      # APK, so until this ran there was no path from a green CI to a release at all -- the
      # APK step above proves R8 works, it does not prove the thing you upload can be built.
      # Signed when the signing secrets above are configured, unsigned (but still validated)
      # otherwise.
      - name: Build release bundle (.aab)
        run: ./gradlew bundleProdRelease

      # Kept for 14 days so a release candidate can be downloaded and uploaded to Play, and
      # so a failed upload can be diagnosed against the exact bytes CI produced.
      #
      # Skipped when the build used the placeholder Firebase config: that bundle compiles and
      # passes R8, but it points at a project that does not exist, so publishing it would ship
      # an app whose Firebase features silently fail. Not uploading it at all is safer than
      # uploading something that looks exactly like a release candidate and is not one.
      - name: Upload release bundle
        if: ${{ steps.firebase_config.outputs.placeholder == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-release-bundle
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 14
          if-no-files-found: error
