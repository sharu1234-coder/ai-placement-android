name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Verifies gradle-wrapper.jar's checksum against Gradle's own published list before
      # anything in this job executes it -- catches a tampered wrapper (supply-chain risk),
      # not just a broken one.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Also sets up Gradle's dependency/build cache via the GitHub Actions cache backend
      # (free for both public and private repos), so repeat runs are much faster.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Belt-and-suspenders: the executable bit is now set in the git index (verified via
      # `git ls-files -s gradlew`), but this costs nothing and removes any fragility if that
      # ever regresses (e.g. Windows tooling with core.fileMode=false re-committing gradlew).
      - run: chmod +x gradlew

      # google-services.json is gitignored (item 17) -- the Google Services Gradle plugin
      # requires one per flavor to exist before ANY Gradle task can run (even unit tests),
      # so this has to happen before every step below. Written from repo secrets, never
      # committed -- separate secrets per flavor since the two files aren't guaranteed to
      # stay identical (e.g. if dev and prod ever move to separate Firebase projects).
      # GitHub masks secret values in logs automatically.
      - name: Write Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_DEV" > app/src/dev/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON_PROD" > app/src/prod/google-services.json

      # Release signing, written from repo secrets when they exist. Deliberately conditional:
      # with no secrets configured this step writes nothing, hasReleaseSigningConfig stays
      # false, and the release build is unsigned -- exactly the previous behavior, so a fork
      # or a contributor's PR still builds. Once ANDROID_KEYSTORE_BASE64 and its three
      # passwords are set on the repo, the same workflow starts producing a signed,
      # Play-uploadable .aab with no further edits.
      #
      # The keystore itself is never committed; it arrives base64-encoded through a secret and
      # is written outside the source tree's tracked paths (keystore.properties is gitignored,
      # and upload-keystore.jks is covered by the same ignore rule). GitHub masks secret values
      # in logs, and nothing here echoes them.
      - name: Write release signing config (only when secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest

      - name: Lint
        run: ./gradlew lintDevDebug

      # A "Dependency freshness report" step (com.github.ben-manes.versions) was tried here as
      # a compensating control alongside weekly Dependabot version PRs, but reverted: applying
      # that plugin breaks kspDevDebugKotlin for every variant with a real Kotlin/KSP/AGP
      # incompatibility in this project (see root build.gradle.kts's comment). Weekly
      # Dependabot PRs remain the only automated dependency-freshness signal for now; revisit
      # after the next Kotlin/KSP/AGP version bump. OWASP dependency-check-gradle (NVD sync,
      # needs an API key this project doesn't have) and a GITHUB_TOKEN-driven Dependabot-
      # alerts-API call (the default Actions token cannot authenticate to that endpoint at all,
      # regardless of the permissions: block -- only a GitHub App or fine-grained PAT with the
      # separate "Dependabot alerts" repository permission can) were separately evaluated and
      # rejected as heavier alternatives.

      - name: Build debug APKs (both flavors)
        run: ./gradlew assembleDevDebug assembleProdDebug

      # Unsigned, not uploaded anywhere -- this only re-validates that R8/shrinking (item 13)
      # still produces a working build on every change, the same check performed manually
      # when minification was first turned on.
      - name: Build release APK (exercises R8/shrinking)
        run: ./gradlew assembleProdRelease

      # The actual publishable artifact. Google Play accepts an Android App Bundle, not an
      # APK, so until this ran there was no path from a green CI to a release at all -- the
      # APK step above proves R8 works, it does not prove the thing you upload can be built.
      # Signed when the signing secrets above are configured, unsigned (but still validated)
      # otherwise.
      - name: Build release bundle (.aab)
        run: ./gradlew bundleProdRelease

      # Kept for 14 days so a release candidate can be downloaded and uploaded to Play, and
      # so a failed upload can be diagnosed against the exact bytes CI produced.
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-release-bundle
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 14
          if-no-files-found: error
