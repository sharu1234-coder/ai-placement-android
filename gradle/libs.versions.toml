[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.10.0"
# 3.0.0 is a major, but verified safe for this project's usage: full suite (674 tests),
# lint, R8 release APK and the release bundle all pass, and it does NOT drag okhttp to 5.x --
# the resolved graph keeps okhttp 4.12.0, and retrofit2-kotlinx-serialization-converter's own
# retrofit 2.9.0 requirement resolves up cleanly.
retrofit = "3.0.0"
okhttp = "4.12.0"
# Previously BLOCKED: 1.11.0 failed compileDevDebugKotlin with "the binary version of its
# metadata is 2.3.0, expected version is 2.0.0" against the old Kotlin 2.0.21 pin. That
# blocker is what the Kotlin 2.3.21 / KSP / AGP / Gradle / Room upgrade above was for, and
# these now compile -- the metadata versions finally agree.
kotlinxSerializationJson = "1.11.0"
retrofitKotlinxSerializationConverter = "1.0.0"
kotlinxCoroutinesAndroid = "1.11.0"
kotlinxCoroutinesTest = "1.11.0"
datastorePreferences = "1.1.1"
# Bumped from 2.6.1 as part of the Kotlin 2.3 toolchain upgrade, and required by it: KSP 2.x
# runs processors through the Analysis API (KspAAWorkerAction), and Room 2.6.1's processor
# predates that -- it fails the build with "[ksp] java.lang.IllegalStateException: unexpected
# jvm signature V" before generating a single DAO. 2.8.4 is the current stable line and
# processes cleanly under KSP2. Room's own runtime API surface used here (see data/local/)
# is unchanged across this range.
room = "2.8.4"
# That "<kotlin-version>-<ksp-release>" rule this comment used to state is no longer how KSP
# is versioned: KSP moved to its own independent version line at 2.3.0 (the last coupled
# release was 2.2.21-2.0.5), so the version here deliberately does NOT spell out the Kotlin
# version any more. It is still a compiler plugin rather than an ordinary library, so it does
# still have to be a release built for the Kotlin line above -- it is just no longer readable
# off the version string. KSP 2.x also requires a newer AGP than 8.7.3 did: 8.7.3 fails at
# configuration with "void AndroidComponentsExtension.addKspConfigurations(boolean)".
ksp = "2.3.11"
# EncryptedSharedPreferences (androidx.security:security-crypto) was deprecated by Google in
# April 2025 -- the current recommended pattern for secure local storage is DataStore (already
# in use here) + Tink for encryption + Android Keystore for key protection, which is what
# TokenStore.kt uses this for. tink-android is the standalone Tink library, not tied to the
# deprecated security-crypto artifact.
tink = "1.21.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
# Was held at 34.1.0 because 34.18.0's transitive play-services-measurement carries Kotlin
# 2.2.0 metadata that the old Kotlin 2.0.21 compiler could not read. The Kotlin 2.3.21
# upgrade removes that constraint, so this is now on the current release.
firebaseBom = "34.18.0"
fragment = "1.9.0"
# Razorpay's own current stable Android Checkout SDK release (com.razorpay:checkout), used
# for TEST MODE order checkout only -- see PaymentActivity.kt equivalent in
# payment/RazorpayCheckoutBridge.kt. Confirmed against Razorpay's own sample app
# (razorpay/razorpay-android-sample-app) and official Android integration docs.
razorpayCheckout = "1.6.40"

[libraries]
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# Versions come from the BoM above -- none pinned here. Since firebase-bom 34.0.0 (Jul 2025)
# the -ktx artifacts are gone; their APIs live in these main modules now (drop the -ktx
# suffix), so these ARE already the Kotlin-idiomatic artifacts, not the old Java-only ones.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
# Not used directly -- forces a floor on the transitive androidx.fragment version pulled in
# by play-services-basement/play-services-base (Firebase's own dependencies), which otherwise
# resolve to 1.1.0 and fail Lint's InvalidFragmentVersionForActivityResult check (needs
# >=1.3.0 for the ActivityResult APIs MainActivity/VoiceInterviewScreen already use).
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
razorpay-checkout = { group = "com.razorpay", name = "checkout", version.ref = "razorpayCheckout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
